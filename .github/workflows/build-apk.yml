name: Build APK + ZAB

# L'APK prodotto qui NON è firmato: la firma avviene fuori dalla CI con il
# keystore privato (non presente nel repo).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        env:
          TT_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee ../build.log

      - name: Rinomina APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk "../out/TrovaTelefono-1.0.${{ github.run_number }}-unsigned.apk"
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: TrovaTelefono-apk
          path: out/*.apk

      - name: Errori come annotation
        if: failure()
        working-directory: .
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|What went wrong|FAILED|Exception|Could not" build.log | head -40 > err.txt || true
          [ -s err.txt ] || tail -40 build.log > err.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt)
          echo "::error title=gradle::${msg}"

  watch:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: watch
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Build Zepp OS (.zab)
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../build.log || npm i 2>&1 | tee -a ../build.log
          npm i -g @zeppos/zeus-cli 2>&1 | tail -5 | tee -a ../build.log
          CI=true zeus build 2>&1 | tee -a ../build.log
          ls -laR dist | tee -a ../build.log
          mkdir -p ../out
          cp dist/*.zab "../out/TrovaTelefono-watch-1.0.${{ github.run_number }}.zab"
      - uses: actions/upload-artifact@v4
        with:
          name: TrovaTelefono-zab
          path: out/*.zab
      - name: Errori come annotation
        if: failure()
        working-directory: .
        run: |
          [ -f build.log ] || exit 0
          tail -60 build.log | sed 's/\x1b\[[0-9;]*m//g' > err.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt)
          echo "::error title=zeus::${msg}"

  publish:
    needs: [build, watch]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Pubblica output sul branch build-output
        run: |
          set -e
          ls -la out || true
          [ -n "$(ls -A out 2>/dev/null)" ] || { echo "nessun output"; exit 0; }
          cd out
          git init -q -b build-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
