name: Build APK + ZAB

# L'APK prodotto qui NON è firmato: la firma avviene fuori dalla CI con il
# keystore privato (non presente nel repo).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          TT_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rinomina APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk "../out/TrovaTelefono-1.0.${{ github.run_number }}-unsigned.apk"
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: TrovaTelefono-apk
          path: out/*.apk

  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Zepp OS (.zab)
        run: |
          npm ci || npm i
          npm i -g @zeppos/zeus-cli
          zeus build
          mkdir -p ../out
          cp dist/*.zab "../out/TrovaTelefono-watch-1.0.${{ github.run_number }}.zab"
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: TrovaTelefono-zab
          path: out/*.zab
